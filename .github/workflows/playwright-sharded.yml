name: Playwright Outlook Suite

on:
  pull_request:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  e2e:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard_index: [1]
        shard_total: [1]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run shard
        env:
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_TOTAL: ${{ matrix.shard_total }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results.json
        run: |
          set -euo pipefail
          npm run test:e2e:shard -- --reporter=line,json
          test -f test-results.json
          python3 - <<'PY2'
import json
from pathlib import Path
report = json.loads(Path('test-results.json').read_text())
stats = report.get('stats', {})
print('===== PLAYWRIGHT JSON STATS =====')
print(json.dumps(stats, indent=2))
passed = stats.get('expected', 0)
failed = stats.get('unexpected', 0)
skipped = stats.get('skipped', 0)
flaky = stats.get('flaky', 0)
if passed + failed + skipped + flaky == 0:
    raise SystemExit('No tests executed; refusing empty green shard.')
PY2
      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shard_index }}
          path: |
            playwright-report
            test-results
            test-results.json
          retention-days: 14
